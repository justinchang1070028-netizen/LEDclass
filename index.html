<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LED 光舞課程教案</title>
<style>
  :root {
    --bg: #0b1020;
    --bg-2: #121a33;
    --card: #162040;
    --card-hover: #1c2a54;
    --text: #e8ecf8;
    --muted: #9aa6c8;
    --line: #26335f;
    --accent: #5cf0ff;
    --accent-2: #ff6bd6;
    --warm: #ffcf6b;
    --glow: 0 0 18px rgba(92, 240, 255, .35);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    color: var(--text);
    background:
      radial-gradient(900px 500px at 10% -10%, rgba(92,240,255,.14), transparent 60%),
      radial-gradient(800px 500px at 100% 0%, rgba(255,107,214,.13), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    line-height: 1.7;
    min-height: 100vh;
  }
  body.modal-open { overflow: hidden; }

  header { padding: 40px 16px 8px; text-align: center; }
  header h1 {
    margin: 0 0 6px;
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    letter-spacing: .06em;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header p { margin: 0; color: var(--muted); }

  .tabs {
    position: sticky; top: 0; z-index: 10;
    display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
    padding: 14px 16px;
    background: linear-gradient(var(--bg), rgba(11,16,32,.85));
    backdrop-filter: blur(8px);
  }
  .tab {
    cursor: pointer;
    font: inherit; font-weight: 600;
    color: var(--muted);
    background: var(--bg-2);
    border: 1px solid var(--line);
    padding: 10px 20px; border-radius: 999px;
    transition: .2s;
  }
  .tab:hover { color: var(--text); border-color: var(--accent); }
  .tab[aria-selected="true"] {
    color: #061018;
    background: linear-gradient(90deg, var(--accent), #9af7ff);
    border-color: transparent;
    box-shadow: var(--glow);
  }

  main { max-width: 1200px; margin: 0 auto; padding: 8px 16px 64px; }
  .focus {
    margin: 8px 0 20px; padding: 12px 16px;
    border-left: 3px solid var(--accent-2);
    background: rgba(255,107,214,.07); border-radius: 0 10px 10px 0;
    color: var(--muted);
  }
  .focus strong { color: var(--text); }

  .grid {
    display: grid; gap: 14px;
    grid-template-columns: 1fr;
    transition: opacity .25s ease, transform .25s ease;
  }
  .grid.fading { opacity: 0; transform: translateY(8px); }
  @media (min-width: 560px)  { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 860px)  { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 1100px) { .grid { grid-template-columns: repeat(4, 1fr); } }

  .card {
    all: unset; box-sizing: border-box; cursor: pointer;
    display: flex; flex-direction: column; gap: 6px;
    padding: 16px 18px; min-height: 108px;
    background: var(--card);
    border: 1px solid var(--line); border-radius: 14px;
    transition: transform .18s, border-color .18s, box-shadow .18s, background .18s;
    position: relative; overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    background: linear-gradient(var(--accent), var(--accent-2));
    opacity: .6; transition: .18s;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-4px);
    background: var(--card-hover);
    border-color: var(--accent);
    box-shadow: var(--glow);
  }
  .card:hover::before, .card:focus-visible::before { opacity: 1; width: 6px; }
  .card .wk { color: var(--accent); font-weight: 700; font-size: .9rem; letter-spacing: .08em; }
  .card .tt { font-weight: 600; }
  .card .hint { margin-top: auto; font-size: .78rem; color: var(--muted); opacity: 0; transition: .18s; }
  .card:hover .hint, .card:focus-visible .hint { opacity: 1; }

  /* Modal */
  .overlay {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: flex-start; justify-content: center;
    padding: 4vh 12px;
    background: rgba(4,7,18,.72); backdrop-filter: blur(4px);
    opacity: 0; visibility: hidden; transition: opacity .22s, visibility .22s;
    overflow-y: auto;
  }
  .overlay.open { opacity: 1; visibility: visible; }
  .modal {
    width: 100%; max-width: 760px;
    background: var(--bg-2);
    border: 1px solid var(--line); border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5), var(--glow);
    transform: translateY(18px) scale(.98); transition: transform .22s;
    position: relative; margin-bottom: 4vh;
  }
  .overlay.open .modal { transform: none; }
  .modal-head {
    padding: 22px 64px 16px 24px; border-bottom: 1px solid var(--line);
  }
  .modal-head .wk { color: var(--accent); font-weight: 700; letter-spacing: .08em; font-size: .9rem; }
  .modal-head h2 { margin: 2px 0 0; font-size: clamp(1.15rem, 3vw, 1.5rem); }
  .close {
    position: absolute; top: 14px; right: 14px;
    width: 40px; height: 40px; border-radius: 50%;
    cursor: pointer; font-size: 1.4rem; line-height: 1; color: var(--text);
    background: var(--card); border: 1px solid var(--line); transition: .18s;
  }
  .close:hover, .close:focus-visible { background: var(--accent-2); color: #1a0613; border-color: transparent; }
  .modal-body { padding: 20px 24px 28px; display: grid; gap: 18px; }
  .sec {
    border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px;
    background: var(--card);
  }
  .sec.parent { border-top: 3px solid var(--warm); }
  .sec.teacher { border-top: 3px solid var(--accent); }
  .sec h3 { margin: 0 0 10px; font-size: 1.05rem; }
  .sec h4 { margin: 14px 0 4px; font-size: .92rem; color: var(--accent); }
  .sec.parent h4 { color: var(--warm); }
  .sec p { margin: 0; }
  .sec ol { margin: 4px 0 0; padding-left: 1.3em; }
  .sec li { margin-bottom: 8px; }
  .say {
    display: block; margin-top: 2px; padding: 6px 10px;
    border-left: 3px solid var(--accent-2);
    background: rgba(255,107,214,.08); border-radius: 0 8px 8px 0; color: #ffd6f3;
  }
  .empty { color: var(--muted); font-style: italic; }

  footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 0 16px 32px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; scroll-behavior: auto !important; }
  }
  @media print {
    body { background: #fff; color: #000; }
    .tabs, .close, footer { display: none; }
    .overlay { position: static; visibility: visible; opacity: 1; background: none; }
    .modal { box-shadow: none; border-color: #999; }
  }
</style>
</head>
<body>

<header>
  <h1>LED 光舞課程教案</h1>
  <p>國小 24 週課程 ・ 家長版與授課老師版雙版本</p>
</header>

<nav class="tabs" role="tablist" aria-label="年級切換" id="tabs"></nav>

<main>
  <div class="focus" id="focus"></div>
  <section class="grid" id="grid" aria-live="polite"></section>
</main>

<footer>點擊任一週卡片即可查看詳細教案</footer>

<div class="overlay" id="overlay" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <button class="close" id="close" aria-label="關閉">&times;</button>
    <div class="modal-head">
      <div class="wk" id="m-week"></div>
      <h2 id="m-title"></h2>
    </div>
    <div class="modal-body" id="m-body"></div>
  </div>
</div>

<script>
/*
  教案資料 lessonData
  結構：lessonData[年級代碼] = { label, focus, weeks: [ ...每週資料 ] }
  每週資料欄位：
    week     週次（數字）
    title    該週主題
    parent   { goal: 教學目標, philosophy: 課程理念 }
    teacher  { safety: 課室安全管理,
               steps: [ { action: 動作拆解, say: 引導口語 }, ... ],
               levels: 難易度與常規設定 }
  內容為空字串或 steps 為空陣列時，視窗內會顯示「內容待補充」。
*/
const lessonData = {
  "low": {
    "label": "低年級 (1-2年級)",
    "focus": "建立安全距離、大肌肉伸展、基本道具常規。",
    "weeks": [
      {
        "week": 1,
        "title": "認識場地與建立雙手伸直的安全距離（無道具）",
        "parent": {
          "goal": "讓孩子認識上課場地，學會用雙手伸直測量自己的「安全泡泡」，建立空間覺察與自我保護的基本觀念，為之後的光舞課程打下穩固基礎。",
          "philosophy": "透過「泡泡遊戲」，孩子學會尊重自己與他人的身體空間，從第一堂課就養成安全第一的好習慣，也建立團體生活的規範感。"
        },
        "teacher": {
          "safety": "先清空場地雜物與尖銳物；孩子展開雙臂時確認不碰到旁人；地面若濕滑需先處理，並請孩子穿防滑鞋。",
          "steps": [
            {
              "action": "帶領孩子沿場地邊緣走一圈，認識牆壁、出口、集合點",
              "say": "「我們先當小偵探，看看教室的四個角落在哪裡！」"
            },
            {
              "action": "雙手側平舉、原地轉一圈",
              "say": "「張開翅膀變小飛機，轉一圈，摸不到任何人才是安全泡泡！」"
            },
            {
              "action": "聽哨音走動，被「泡泡」碰到就停下調整",
              "say": "「泡泡不可以碰到別人的泡泡，碰到了就悄悄飄開喔！」"
            }
          ],
          "levels": "簡化：先站定點練習，再開始移動。加難：縮小場地、加快節奏。常規：哨音一響立刻停、手放下、眼睛看老師。"
        }
      },
      {
        "week": 2,
        "title": "身體部位大肌肉伸展與模仿遊戲（無道具）",
        "parent": {
          "goal": "透過全身性的伸展與模仿遊戲，活絡孩子的大肌肉群，提升身體柔軟度與模仿力，同時降低之後揮舞動作時受傷的風險。",
          "philosophy": "孩子在模仿動物與物品的趣味中放鬆身心，不知不覺學會暖身的重要性，也培養專注觀察與身體控制的能力。"
        },
        "teacher": {
          "safety": "伸展不可用力彈震或硬拉；提醒孩子感到痠即可，不可忍痛；維持安全泡泡距離。",
          "steps": [
            {
              "action": "頸、肩、手臂伸展",
              "say": "「大長頸鹿慢慢把脖子伸長，左邊吃樹葉、右邊吃樹葉！」"
            },
            {
              "action": "軀幹與腿部伸展",
              "say": "「變成一棵大樹，風吹來，左搖搖、右搖搖，腳底長根不能動喔！」"
            },
            {
              "action": "老師做動作、孩子模仿",
              "say": "「看老師的身體變魔術，你也跟著變！」"
            }
          ],
          "levels": "簡化：只做上半身動作。加難：由孩子輪流當小老師帶動作。常規：伸展時安靜數 5 秒，不推擠、不拉扯同學。"
        }
      },
      {
        "week": 3,
        "title": "空間移動與避開障礙物練習（無道具）",
        "parent": {
          "goal": "訓練孩子在移動中觀察周圍環境，學會閃避障礙物與同伴，增進空間判斷力、反應力與身體協調。",
          "philosophy": "透過闖關式的移動遊戲，孩子學會「邊走邊看」的習慣，這是日後安全使用發光道具、在團體中舞動的重要基礎能力。"
        },
        "teacher": {
          "safety": "全程以「走」為主，禁止奔跑；障礙物使用軟墊或圓錐，不使用硬物；注意轉角處的碰撞。",
          "steps": [
            {
              "action": "在場地自由慢走，保持泡泡距離",
              "say": "「像在海裡游泳的小魚，慢慢游，不碰到別的魚！」"
            },
            {
              "action": "繞過圓錐、軟墊等障礙物",
              "say": "「前面有大石頭，眼睛先看到，身體再繞過去！」"
            },
            {
              "action": "改變方向與速度",
              "say": "「聽到鈴鼓變快，小魚快快游；鈴鼓變慢，小魚慢慢游。」"
            }
          ],
          "levels": "簡化：減少障礙物、放慢速度。加難：增加障礙物、加入倒退走。常規：不推人、不搶路，碰到要說「對不起」。"
        }
      },
      {
        "week": 4,
        "title": "聽指令瞬間煞車與靜止練習（無道具）",
        "parent": {
          "goal": "訓練孩子聽到指令能立即停止動作並保持穩定，培養專注力、自我控制能力與身體平衡感。",
          "philosophy": "「會停」比「會動」更重要。學會煞車，孩子之後手持發光道具時才能安全地控制自己，也培養了自律與傾聽的習慣。"
        },
        "teacher": {
          "safety": "煞車時避免突然急停造成跌倒；要求以半蹲、重心放低的方式停下；留意地面是否濕滑。",
          "steps": [
            {
              "action": "練習走動與立即停止",
              "say": "「聽到『停』，腳底黏膠水，一動也不動！」"
            },
            {
              "action": "靜止時保持姿勢 3 秒",
              "say": "「變成雕像，連眼睛都不眨，看誰最像！」"
            },
            {
              "action": "用不同指令（鈴聲、口令、手勢）煞車",
              "say": "「老師舉紅色卡片就停，舉綠色卡片就走。」"
            }
          ],
          "levels": "簡化：先用大聲口令。加難：改用手勢或音樂停頓，延長定格到 5 秒。常規：定格時嘴巴閉起來、手腳不亂動。"
        }
      },
      {
        "week": 5,
        "title": "認識 LED 道具與安全拿放規則",
        "parent": {
          "goal": "讓孩子認識 LED 光棒的構造與開關，學會正確、安全地拿取與歸還，建立對器材的尊重與責任感。",
          "philosophy": "道具是孩子的「光之夥伴」。透過愛護器材的常規，培養孩子的責任心、秩序感與安全意識。"
        },
        "teacher": {
          "safety": "領取道具前先確認安全泡泡；全程禁止將光棒指向他人臉部；未經許可不得開啟；老師先檢查光棒無破損。",
          "steps": [
            {
              "action": "認識光棒各部位與開關",
              "say": "「這是光棒的頭、身體和開關，我們要輕輕對待它！」"
            },
            {
              "action": "正確持握，光棒朝下或朝上",
              "say": "「像握著冰淇淋一樣，穩穩握好，不亂甩。」"
            },
            {
              "action": "領取與歸還流程",
              "say": "「排好隊、慢慢走、兩手捧，小心放回光棒家！」"
            }
          ],
          "levels": "簡化：先用無燈光的替代棒練習持握。加難：加入「蒙眼摸出自己位置」的趣味。常規：光棒落地要先撿、再報告，不可用來打鬧。"
        }
      },
      {
        "week": 6,
        "title": "單手持具定點揮舞（畫直線）",
        "parent": {
          "goal": "學習單手持棒、在固定位置畫出上下與左右直線，提升手眼協調、手臂控制與軌跡感知。",
          "philosophy": "孩子看見自己畫出的光線，獲得即時的成就感，同時學會控制力道與方向，建立自信。"
        },
        "teacher": {
          "safety": "雙腳固定不移動；揮動幅度控制在身體前方，不超過肩寬；確保與旁人距離大於一臂加光棒長度。",
          "steps": [
            {
              "action": "單手握棒，手臂前伸",
              "say": "「手拿光棒，像拿著魔法棒，對準前面的空氣。」"
            },
            {
              "action": "畫上下直線",
              "say": "「用光棒畫一座電梯，上、下、上、下！」"
            },
            {
              "action": "畫左右直線",
              "say": "「換成雨刷，左、右、左、右，把雨滴刷乾淨！」"
            }
          ],
          "levels": "簡化：先關燈光練動作再開燈。加難：配合拍數畫線。常規：聽到「收」就把光棒垂在身側，不揮舞。"
        }
      },
      {
        "week": 7,
        "title": "單手持具定點揮舞（畫大圓形）",
        "parent": {
          "goal": "學會用單手畫出順暢的大圓，發展手臂與肩膀的協調性，以及連貫流暢的動作感。",
          "philosophy": "圓形是光舞最基本也最美的軌跡。孩子在畫圓的過程中學會放鬆與連續，也感受到「控制」帶來的成就感。"
        },
        "teacher": {
          "safety": "畫圓時手臂勿過度甩動；圓的大小以不碰到旁人為準；先在無燈或慢速下練習，確認隊形間距。",
          "steps": [
            {
              "action": "空手在空中畫圓",
              "say": "「先用手指畫一個大太陽！」"
            },
            {
              "action": "拿光棒在身體前方畫圓",
              "say": "「光棒變成畫筆，慢慢畫一個大大的圓圈。」"
            },
            {
              "action": "順時針與逆時針切換",
              "say": "「太陽往右轉、往左轉，轉得圓圓的才漂亮！」"
            }
          ],
          "levels": "簡化：縮小圓、放慢速度。加難：連續畫 3 圈不中斷。常規：圓畫太大或手臂過高，老師以手勢提醒收小。"
        }
      },
      {
        "week": 8,
        "title": "左右換手練習與道具握持穩定度",
        "parent": {
          "goal": "練習左右手交替持棒，增進雙側協調與握持穩定度，避免單側慣用手過度依賴。",
          "philosophy": "左右手都能運用，有助於大腦兩側均衡發展；孩子學習安全換手，也培養耐心與細心。"
        },
        "teacher": {
          "safety": "換手時光棒朝下、手貼近身體，避免拋接；掉落時先停動作再撿；保持間距。",
          "steps": [
            {
              "action": "右手持棒畫直線與圓",
              "say": "「先用最厲害的手，畫一條線、一個圓。」"
            },
            {
              "action": "在胸前安全換手",
              "say": "「光棒搭火車，從右手慢慢開到左手，要停穩再放開！」"
            },
            {
              "action": "左手練習相同動作",
              "say": "「換左手當主角，也要畫出漂亮的光！」"

const gradeOrder = ["low", "mid", "high"];
let currentGrade = "low";
let lastFocus = null;

const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};

function renderTabs() {
  const tabs = $("tabs");
  gradeOrder.forEach((key) => {
    const b = el("button", "tab", lessonData[key].label);
    b.type = "button";
    b.setAttribute("role", "tab");
    b.dataset.grade = key;
    b.addEventListener("click", () => switchGrade(key));
    tabs.appendChild(b);
  });
}

function updateTabs() {
  document.querySelectorAll(".tab").forEach((b) =>
    b.setAttribute("aria-selected", String(b.dataset.grade === currentGrade)));
}

function renderGrid() {
  const g = lessonData[currentGrade];
  $("focus").replaceChildren();
  const s = el("strong", null, "教學重點：");
  $("focus").append(s, document.createTextNode(g.focus));

  const grid = $("grid");
  grid.replaceChildren();
  g.weeks.forEach((w) => {
    const c = el("button", "card");
    c.type = "button";
    c.append(el("span", "wk", "第 " + w.week + " 週"), el("span", "tt", w.title), el("span", "hint", "點擊查看教案 →"));
    c.addEventListener("click", () => openModal(w));
    grid.appendChild(c);
  });
}

function switchGrade(key) {
  if (key === currentGrade) return;
  const grid = $("grid");
  grid.classList.add("fading");
  setTimeout(() => {
    currentGrade = key;
    updateTabs();
    renderGrid();
    grid.classList.remove("fading");
  }, 220);
}

function field(h, value) {
  const f = document.createDocumentFragment();
  f.appendChild(el("h4", null, h));
  f.appendChild(value ? el("p", null, value) : el("p", "empty", "內容待補充"));
  return f;
}

function openModal(w) {
  lastFocus = document.activeElement;
  $("m-week").textContent = "第 " + w.week + " 週";
  $("m-title").textContent = w.title;

  const body = $("m-body");
  body.replaceChildren();

  const p = w.parent || {};
  const parent = el("div", "sec parent");
  parent.appendChild(el("h3", null, "👨‍👩‍👧 家長版教案"));
  parent.append(field("教學目標", p.goal), field("課程理念", p.philosophy));

  const t = w.teacher || {};
  const teacher = el("div", "sec teacher");
  teacher.appendChild(el("h3", null, "🧑‍🏫 授課老師版教案"));
  teacher.appendChild(field("課室安全管理", t.safety));

  teacher.appendChild(el("h4", null, "分解教學與口語引導"));
  if (t.steps && t.steps.length) {
    const ol = el("ol");
    t.steps.forEach((s) => {
      const li = el("li");
      li.appendChild(document.createTextNode(s.action));
      if (s.say) li.appendChild(el("span", "say", "引導口語：" + s.say));
      ol.appendChild(li);
    });
    teacher.appendChild(ol);
  } else {
    teacher.appendChild(el("p", "empty", "內容待補充"));
  }
  teacher.appendChild(field("難易度與常規設定", t.levels));

  body.append(parent, teacher);

  const ov = $("overlay");
  ov.classList.add("open");
  ov.setAttribute("aria-hidden", "false");
  document.body.classList.add("modal-open");
  ov.scrollTop = 0;
  $("close").focus();
}

function closeModal() {
  const ov = $("overlay");
  ov.classList.remove("open");
  ov.setAttribute("aria-hidden", "true");
  document.body.classList.remove("modal-open");
  if (lastFocus) lastFocus.focus();
}

$("close").addEventListener("click", closeModal);
$("overlay").addEventListener("click", (e) => { if (e.target === $("overlay")) closeModal(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

renderTabs();
updateTabs();
renderGrid();
</script>
