<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LED 光舞課程教案｜授課老師版</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LED 光舞">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --bg: #0b1020;
    --bg-2: #121a33;
    --card: #162040;
    --card-hover: #1c2a54;
    --text: #e8ecf8;
    --muted: #9aa6c8;
    --line: #26335f;
    --accent: #5cf0ff;
    --accent-2: #ff6bd6;
    --warm: #ffcf6b;
    --glow: 0 0 18px rgba(92, 240, 255, .35);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    color: var(--text);
    background:
      radial-gradient(900px 500px at 10% -10%, rgba(92,240,255,.14), transparent 60%),
      radial-gradient(800px 500px at 100% 0%, rgba(255,107,214,.13), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    line-height: 1.7;
    min-height: 100vh;
  }
  body.modal-open { overflow: hidden; }

  header { padding: 40px 16px 8px; text-align: center; }
  header h1 {
    margin: 0 0 6px;
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    letter-spacing: .06em;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header p { margin: 0; color: var(--muted); }

  .tabs {
    position: sticky; top: 0; z-index: 10;
    display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
    padding: 14px 16px;
    background: linear-gradient(var(--bg), rgba(11,16,32,.85));
    backdrop-filter: blur(8px);
  }
  .tab {
    cursor: pointer;
    font: inherit; font-weight: 600;
    color: var(--muted);
    background: var(--bg-2);
    border: 1px solid var(--line);
    padding: 10px 20px; border-radius: 999px;
    transition: .2s;
  }
  .tab:hover { color: var(--text); border-color: var(--accent); }
  .tab[aria-selected="true"] {
    color: #061018;
    background: linear-gradient(90deg, var(--accent), #9af7ff);
    border-color: transparent;
    box-shadow: var(--glow);
  }

  main { max-width: 1200px; margin: 0 auto; padding: 8px 16px 64px; }
  .focus {
    margin: 8px 0 20px; padding: 12px 16px;
    border-left: 3px solid var(--accent-2);
    background: rgba(255,107,214,.07); border-radius: 0 10px 10px 0;
    color: var(--muted);
  }
  .focus strong { color: var(--text); }

  .grid {
    display: grid; gap: 14px;
    grid-template-columns: 1fr;
    transition: opacity .25s ease, transform .25s ease;
  }
  .grid.fading { opacity: 0; transform: translateY(8px); }
  @media (min-width: 560px)  { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 860px)  { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 1100px) { .grid { grid-template-columns: repeat(4, 1fr); } }

  .card {
    all: unset; box-sizing: border-box; cursor: pointer;
    display: flex; flex-direction: column; gap: 6px;
    padding: 16px 18px; min-height: 108px;
    background: var(--card);
    border: 1px solid var(--line); border-radius: 14px;
    transition: transform .18s, border-color .18s, box-shadow .18s, background .18s;
    position: relative; overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    background: linear-gradient(var(--accent), var(--accent-2));
    opacity: .6; transition: .18s;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-4px);
    background: var(--card-hover);
    border-color: var(--accent);
    box-shadow: var(--glow);
  }
  .card:hover::before, .card:focus-visible::before { opacity: 1; width: 6px; }
  .card .wk { color: var(--accent); font-weight: 700; font-size: .9rem; letter-spacing: .08em; }
  .card .tt { font-weight: 600; }
  .card .hint { margin-top: auto; font-size: .78rem; color: var(--muted); opacity: 0; transition: .18s; }
  .card:hover .hint, .card:focus-visible .hint { opacity: 1; }

  /* Modal */
  .overlay {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: flex-start; justify-content: center;
    padding: 4vh 12px;
    background: rgba(4,7,18,.72); backdrop-filter: blur(4px);
    opacity: 0; visibility: hidden; transition: opacity .22s, visibility .22s;
    overflow-y: auto;
  }
  .overlay.open { opacity: 1; visibility: visible; }
  .modal {
    width: 100%; max-width: 760px;
    background: var(--bg-2);
    border: 1px solid var(--line); border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5), var(--glow);
    transform: translateY(18px) scale(.98); transition: transform .22s;
    position: relative; margin-bottom: 4vh;
  }
  .overlay.open .modal { transform: none; }
  .modal-head {
    padding: 22px 64px 16px 24px; border-bottom: 1px solid var(--line);
  }
  .modal-head .wk { color: var(--accent); font-weight: 700; letter-spacing: .08em; font-size: .9rem; }
  .modal-head h2 { margin: 2px 0 0; font-size: clamp(1.15rem, 3vw, 1.5rem); }
  .close {
    position: absolute; top: 14px; right: 14px;
    width: 40px; height: 40px; border-radius: 50%;
    cursor: pointer; font-size: 1.4rem; line-height: 1; color: var(--text);
    background: var(--card); border: 1px solid var(--line); transition: .18s;
  }
  .close:hover, .close:focus-visible { background: var(--accent-2); color: #1a0613; border-color: transparent; }
  .modal-body { padding: 20px 24px 28px; display: grid; gap: 18px; }
  .sec {
    border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px;
    background: var(--card);
  }
  .sec.parent { border-top: 3px solid var(--warm); }
  .sec.teacher { border-top: 3px solid var(--accent); }
  .sec h3 { margin: 0 0 10px; font-size: 1.05rem; }
  .sec h4 { margin: 14px 0 4px; font-size: .92rem; color: var(--accent); }
  .sec.parent h4 { color: var(--warm); }
  .sec p { margin: 0; }
  .sec ol { margin: 4px 0 0; padding-left: 1.3em; }
  .sec li { margin-bottom: 8px; }
  .say {
    display: block; margin-top: 2px; padding: 6px 10px;
    border-left: 3px solid var(--accent-2);
    background: rgba(255,107,214,.08); border-radius: 0 8px 8px 0; color: #ffd6f3;
  }
  .empty { color: var(--muted); font-style: italic; }

  footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 0 16px 32px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; scroll-behavior: auto !important; }
  }
  @media print {
    body { background: #fff; color: #000; }
    .tabs, .close, footer { display: none; }
    .overlay { position: static; visibility: visible; opacity: 1; background: none; }
    .modal { box-shadow: none; border-color: #999; }
  }

  /* ===== 老師版新增 ===== */
  .music { margin-top: 12px !important; padding: 8px 12px; border-radius: 10px; background: rgba(92,240,255,.08); border: 1px dashed var(--accent); color: var(--accent); font-weight: 600; }
  .games { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 8px; }
  .games li { margin: 0; padding: 8px 12px; border-radius: 10px; background: rgba(255,207,107,.07); border-left: 3px solid var(--warm); display: grid; gap: 2px; }
  .games .g-base { color: var(--muted); font-size: .9rem; }
  .games .g-tip { font-size: .92rem; }
  footer small { display: block; margin-top: 6px; font-size: .75rem; opacity: .85; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .modal { max-width: 1000px; }
  .steps-layout { display: grid; gap: 16px; grid-template-columns: 1fr; align-items: start; }
  @media (min-width: 860px) {
    .steps-layout { grid-template-columns: minmax(0, 1fr) minmax(300px, 380px); }
    .video-box { position: sticky; top: 12px; }
  }
  .video-box {
    border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    background: #060a18;
  }
  .video-box h5 { margin: 0; padding: 8px 12px; font-size: .85rem; color: var(--accent); border-bottom: 1px solid var(--line); }
  .video-frame { position: relative; aspect-ratio: 16 / 9; background: #000; }
  .video-frame video { width: 100%; height: 100%; display: block; background: #000; }
  .video-ph {
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 4px; text-align: center;
    padding: 12px; color: var(--muted); font-size: .85rem;
    background: repeating-linear-gradient(45deg, #0a1128, #0a1128 12px, #0d1633 12px, #0d1633 24px);
  }
  .video-ph b { color: var(--text); font-size: 1rem; }
  .video-ph code { color: var(--warm); font-size: .78rem; word-break: break-all; }
  .video-frame.missing video { visibility: hidden; }
  .video-frame.missing .video-ph { display: flex; }
  .toolbar { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; padding: 0 16px 8px; align-items: center; }
  .btn {
    cursor: pointer; font: inherit; font-size: .88rem; color: var(--text);
    background: var(--bg-2); border: 1px solid var(--line); border-radius: 999px; padding: 6px 16px;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:disabled { opacity: .5; cursor: default; }
  #net-status { font-size: .8rem; color: var(--muted); }
  #net-status.offline { color: var(--warm); }
  @media print { body * { display: none !important; } body::before { content: "本教案僅供授課老師於 App 內瀏覽，不提供列印。"; display: block; padding: 2rem; } }
</style>
</head>
<body>

<header>
  <h1>LED 光舞課程教案</h1>
  <p>國小 24 週課程 ・ 家長版與授課老師版雙版本</p>
</header>

<div class="toolbar">
  <button class="btn" id="btn-cache" type="button" hidden>📥 離線儲存示範影片</button>
  <span id="net-status" role="status"></span>
</div>

<nav class="tabs" role="tablist" aria-label="年級切換" id="tabs"></nav>

<main>
  <div class="focus" id="focus"></div>
  <section class="grid" id="grid" aria-live="polite"></section>
</main>

<footer>點擊任一週卡片即可查看詳細教案<small>註：NCS 音樂為免費商用，若老師用於錄影發布，請依官方規範於影片資訊欄標註來源。</small></footer>

<div class="overlay" id="overlay" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <button class="close" id="close" aria-label="關閉">&times;</button>
    <div class="modal-head">
      <div class="wk" id="m-week"></div>
      <h2 id="m-title"></h2>
    </div>
    <div class="modal-body" id="m-body"></div>
  </div>
</div>

<script>
/*
  教案資料 lessonData
  結構：lessonData[年級代碼] = { label, focus, weeks: [ ...每週資料 ] }
  每週資料欄位：
    week     週次（數字）
    title    該週主題
    parent   { goal: 教學目標, philosophy: 課程理念 }
    teacher  { safety: 課室安全管理,
               steps: [ { action: 動作拆解, say: 引導口語 }, ... ],
               levels: 難易度與常規設定 }
  內容為空字串或 steps 為空陣列時，視窗內會顯示「內容待補充」。
*/
const lessonData = {
  "low": {
    "label": "低年級 (1-2年級)",
    "focus": "建立安全距離、大肌肉伸展、基本道具常規。",
    "weeks": [
      {
        "week": 1,
        "title": "認識場地與建立雙手伸直的安全距離（無道具）",
        "parent": {
          "goal": "讓孩子認識上課場地，學會用雙手伸直測量自己的「安全泡泡」，建立空間覺察與自我保護的基本觀念，為之後的光舞課程打下穩固基礎。",
          "philosophy": "透過「泡泡遊戲」，孩子學會尊重自己與他人的身體空間，從第一堂課就養成安全第一的好習慣，也建立團體生活的規範感。"
        },
        "teacher": {
          "safety": "上課前清空場地的雜物、尖銳物與滑倒風險；確認出口與集合點暢通；請孩子穿防滑鞋，長髮綁起。展開雙臂測量時，先確認前後左右沒有碰到旁人。",
          "steps": [
            {
              "action": "集合與認識場地：帶孩子沿場地邊緣走一圈，指出牆壁、出口、老師位置與集合點",
              "say": "「這是我們的光舞基地！這裡是出口，聽到哨音，我們就跑回集合點。」"
            },
            {
              "action": "安全泡泡示範：老師雙手向前、向旁伸直，原地慢慢轉一圈，示範「手指碰不到任何東西」就是安全泡泡",
              "say": "「伸出你的雙手，慢慢轉一圈，沒有碰到人，就是你的安全泡泡！」"
            },
            {
              "action": "全班找位置：每個孩子自己找一個點，轉圈確認泡泡不碰到別人，必要時老師逐一微調",
              "say": "「找一個自己的小星球站好，碰到別人的星球就往旁邊移動一小步。」"
            },
            {
              "action": "遊戲「燈光指令紅綠燈」：亮燈時在場內慢走，滅燈瞬間定格，並確認泡泡沒有重疊",
              "say": "「燈亮了，小星星開始散步；燈滅了，變成小雕像，一動也不動！」"
            },
            {
              "action": "收操與約定：深呼吸三次，複習三個常規——聽哨音、泡泡不碰人、手放下",
              "say": "「我們來比一比，誰最會當一個守規矩的光舞小英雄？」"
            }
          ],
          "levels": "簡化：先站定點練習泡泡，再開始慢走。加難：縮小場地、加快燈號切換。常規：哨音一響立刻停、手放下、眼睛看老師。"
        },
        "music": [],
        "games": [
          {
            "name": "燈光指令紅綠燈",
            "tip": "老師用手電筒或教室電燈當信號：亮燈走、滅燈定格，順便練習「在自己的安全泡泡裡移動」。"
          }
        ]
      },
      {
        "week": 2,
        "title": "身體部位大肌肉伸展與模仿遊戲（無道具）",
        "parent": {
          "goal": "透過全身性的伸展與模仿遊戲，活絡孩子的大肌肉群，提升身體柔軟度與模仿力，同時降低之後揮舞動作時受傷的風險。",
          "philosophy": "孩子在模仿動物與物品的趣味中放鬆身心，不知不覺學會暖身的重要性，也培養專注觀察與身體控制的能力。"
        },
        "teacher": {
          "safety": "伸展動作由小到大、慢速進行，不彈震、不硬拉；兩人一組時保持一臂以上距離；孩子喊痛或不舒服立即停止。",
          "steps": [
            {
              "action": "暖身：原地踏步 10 下，聳肩、轉肩各 4 次，喚醒身體",
              "say": "「小機器人開機中，先動動肩膀！」"
            },
            {
              "action": "上半身伸展：頸部左右、手臂向上伸展、向前抱胸；每個動作停留心中數 5 秒",
              "say": "「像大樹長高高，數到五，再慢慢放下來。」"
            },
            {
              "action": "下半身伸展：弓箭步前後交換、蹲下站起、轉動腳踝；強調膝蓋朝腳尖方向",
              "say": "「膝蓋對準腳尖，不要往內扣喔！」"
            },
            {
              "action": "遊戲「鏡子遊戲」：老師做動作，孩子當鏡子完全模仿；再換小組互當鏡子",
              "say": "「你的身體是鏡子，要跟前面的人一模一樣，連速度都要一樣喔！」"
            },
            {
              "action": "遊戲「氣象播報」：喊「龍捲風」快速甩手轉動、「微風」慢動作輕搖，最後以微風收尾平靜呼吸",
              "say": "「微風來了，慢慢吹、慢慢吹……我們的身體都安靜下來了。」"
            }
          ],
          "levels": "簡化：只做上半身動作。加難：由孩子輪流當小老師帶動作。常規：伸展時安靜數 5 秒，不推擠、不拉扯同學。"
        },
        "music": [
          "Max Brhon - Humanity"
        ],
        "games": [
          {
            "name": "鏡子遊戲",
            "tip": "無道具版：老師當鏡子的人，孩子完全模仿老師的伸展動作；熟悉後兩人一組互換。"
          },
          {
            "name": "氣象播報",
            "tip": "「龍捲風」改為快速甩手，「微風」改為慢慢伸展，讓孩子體會速度與力度的差別。"
          }
        ]
      },
      {
        "week": 3,
        "title": "空間移動與避開障礙物練習（無道具）",
        "parent": {
          "goal": "訓練孩子在移動中觀察周圍環境，學會閃避障礙物與同伴，增進空間判斷力、反應力與身體協調。",
          "philosophy": "透過闖關式的移動遊戲，孩子學會「邊走邊看」的習慣，這是日後安全使用發光道具、在團體中舞動的重要基礎能力。"
        },
        "teacher": {
          "safety": "只在老師畫定的區域內移動；放慢速度，禁止奔跑；以「看前方、看兩側」為口訣；場地中的障礙物使用軟墊或軟質標誌桶。",
          "steps": [
            {
              "action": "複習安全泡泡：全班原地伸直雙臂轉一圈，再練習慢走 10 步不碰人",
              "say": "「慢慢走，用眼睛當雷達，掃描前面和旁邊！」"
            },
            {
              "action": "自由漫步：在場地內自由移動，遇到人就換方向，不停下來也不碰到",
              "say": "「像小魚游泳，遇到別的魚就轉彎繞過去。」"
            },
            {
              "action": "繞過軟墊或標誌桶：排隊依序繞行，要求身體不碰到物品，保持前一人兩步距離",
              "say": "「繞過障礙物，像滑雪選手一樣，彎彎的、慢慢的。」"
            },
            {
              "action": "遊戲「障礙穿越」：老師用繩子或膠帶在空中、地上設定想像的紅外線，孩子低身、側身通過",
              "say": "「小心！這裡有看不見的紅外線，碰到會警報響！」"
            },
            {
              "action": "改變方向與速度：聽到「變快」「變慢」「轉彎」指令時調整，最後排隊收操",
              "say": "「聽老師的指令，快、慢、轉彎，你都做得到！」"
            }
          ],
          "levels": "簡化：用寬走道、減少障礙物。加難：增加障礙物、加快節奏。常規：不奔跑、不推擠，碰到物品要立刻說出並重新開始。"
        },
        "music": [
          "JJD - Adventure"
        ],
        "games": [
          {
            "name": "障礙穿越",

/* 遊戲素材庫：week.games[].name 對應這裡的說明 */
const gameLibrary = {
  "燈光指令紅綠燈": "老師亮燈大家走，燈一滅瞬間定格。",
  "魔法雕像木頭人": "音樂停時，必須擺出指定的 LED 道具姿勢（如：高舉、平舉）。",

  "氣象播報": "老師喊「龍捲風」就快速轉圈揮舞，「微風」就慢動作輕輕搖晃。",

  "光影接龍": "圍成圓圈，一人做一個動作，下一人要重複前一人的動作並加上自己的。",
  "尋寶探險": "把未發光的 LED 棍當作手電筒，跟著老師的軌跡探索教室空間。",
  "能量傳遞": "學生圍圈，用道具頂端輕碰旁邊同學的道具，把「發光能量」傳遞下去。",
  "軌跡畫布": "用道具在空中畫出巨大的幾何圖形或數字，讓同學猜。",
  "節奏打擊": "配合音樂重拍，用道具末端輕輕點地打節拍。",
  "障礙穿越": "想像地上有紅外線，拿著道具要保持平穩不能晃動通過。",
  "光之引導者": "一人閉眼，另一人用道具輕敲地板的聲音引導方向。"
};

const gradeOrder = ["low", "mid", "high"];
let currentGrade = "low";
let lastFocus = null;

const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};

function renderTabs() {
  const tabs = $("tabs");
  gradeOrder.forEach((key) => {
    const b = el("button", "tab", lessonData[key].label);
    b.type = "button";
    b.setAttribute("role", "tab");
    b.dataset.grade = key;
    b.addEventListener("click", () => switchGrade(key));
    tabs.appendChild(b);
  });
}

function updateTabs() {
  document.querySelectorAll(".tab").forEach((b) =>
    b.setAttribute("aria-selected", String(b.dataset.grade === currentGrade)));
}

function renderGrid() {
  const g = lessonData[currentGrade];
  $("focus").replaceChildren();
  const s = el("strong", null, "教學重點：");
  $("focus").append(s, document.createTextNode(g.focus));

  const grid = $("grid");
  grid.replaceChildren();
  g.weeks.forEach((w) => {
    const c = el("button", "card");
    c.type = "button";
    c.append(el("span", "wk", "第 " + w.week + " 週"), el("span", "tt", w.title), el("span", "hint", "點擊查看教案 →"));
    c.addEventListener("click", () => openModal(w));
    grid.appendChild(c);
  });
}

function switchGrade(key) {
  if (key === currentGrade) return;
  const grid = $("grid");
  grid.classList.add("fading");
  setTimeout(() => {
    currentGrade = key;
    updateTabs();
    renderGrid();
    grid.classList.remove("fading");
  }, 220);
}

function field(h, value) {
  const f = document.createDocumentFragment();
  f.appendChild(el("h4", null, h));
  f.appendChild(value ? el("p", null, value) : el("p", "empty", "內容待補充"));
  return f;
}

/* 影片路徑規則：videos/<年級>-w<兩位週次>.mp4，例如 videos/low-w01.mp4。
   也可在某週資料加上 video: "自訂路徑.mp4" 覆蓋預設。 */
function videoPath(w) {
  return w.video || ("videos/" + currentGrade + "-w" + String(w.week).padStart(2, "0") + ".mp4");
}

function videoBlock(w) {
  const src = videoPath(w);
  const box = el("aside", "video-box");
  box.appendChild(el("h5", null, "🎬 動作示範影片"));
  const frame = el("div", "video-frame");
  const v = document.createElement("video");
  v.controls = true; v.preload = "none"; v.playsInline = true;
  v.setAttribute("controlslist", "nodownload noremoteplayback");
  v.setAttribute("disablepictureinpicture", "");
  v.addEventListener("contextmenu", (e) => e.preventDefault());
  const source = document.createElement("source");
  source.src = src; source.type = "video/mp4";
  v.appendChild(source);
  const ph = el("div", "video-ph");
  ph.append(el("b", null, "影片尚未上傳"), document.createTextNode("請將示範影片放在："), el("code", null, src));
  const markMissing = () => frame.classList.add("missing");
  source.addEventListener("error", markMissing);
  v.addEventListener("error", markMissing);
  frame.append(v, ph);
  box.appendChild(frame);
  return box;
}

function openModal(w) {
  lastFocus = document.activeElement;
  $("m-week").textContent = "第 " + w.week + " 週";
  $("m-title").textContent = w.title;

  const body = $("m-body");
  body.replaceChildren();

  const p = w.parent || {};
  const parent = el("div", "sec parent");
  parent.appendChild(el("h3", null, "👨‍👩‍👧 家長版教案"));
  parent.append(field("教學目標", p.goal), field("課程理念", p.philosophy));

  const t = w.teacher || {};
  const teacher = el("div", "sec teacher");
  teacher.appendChild(el("h3", null, "🧑‍🏫 授課老師版教案"));
  teacher.appendChild(field("課室安全管理", t.safety));

  if (w.music && w.music.length) {
    const m = el("p", "music", "🎵 建議搭配：" + w.music.join("、"));
    teacher.appendChild(m);
  }
  if (w.games && w.games.length) {
    teacher.appendChild(el("h4", null, "推薦遊戲"));
    const ul = el("ul", "games");
    w.games.forEach((g) => {
      const li = el("li");
      li.appendChild(el("strong", null, "🎮 " + g.name));
      const base = gameLibrary[g.name];
      if (base) li.appendChild(el("span", "g-base", "玩法：" + base));
      if (g.tip) li.appendChild(el("span", "g-tip", "本週應用：" + g.tip));
      ul.appendChild(li);
    });
    teacher.appendChild(ul);
  }

  teacher.appendChild(el("h4", null, "分解教學與口語引導"));
  const layout = el("div", "steps-layout");
  const stepsCol = el("div");
  if (t.steps && t.steps.length) {
    const ol = el("ol");
    t.steps.forEach((s) => {
      const li = el("li");
      li.appendChild(document.createTextNode(s.action));
      if (s.say) li.appendChild(el("span", "say", "引導口語：" + s.say));
      ol.appendChild(li);
    });
    stepsCol.appendChild(ol);
  } else {
    stepsCol.appendChild(el("p", "empty", "內容待補充"));
  }
  layout.append(stepsCol, videoBlock(w));
  teacher.appendChild(layout);
  teacher.appendChild(field("難易度與常規設定", t.levels));

  body.append(parent, teacher);

  const ov = $("overlay");
  ov.classList.add("open");
  ov.setAttribute("aria-hidden", "false");
  document.body.classList.add("modal-open");
  ov.scrollTop = 0;
  $("close").focus();
}

function closeModal() {
  const ov = $("overlay");
  ov.classList.remove("open");
  ov.setAttribute("aria-hidden", "true");
  document.body.classList.remove("modal-open");
  if (lastFocus) lastFocus.focus();
}

$("close").addEventListener("click", closeModal);
$("overlay").addEventListener("click", (e) => { if (e.target === $("overlay")) closeModal(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

renderTabs();
updateTabs();
renderGrid();

/* ===== PWA：Service Worker 註冊、網路狀態、離線儲存影片 ===== */
document.addEventListener("contextmenu", (e) => e.preventDefault());

function allVideoUrls() {
  const urls = [];
  gradeOrder.forEach((g) => lessonData[g].weeks.forEach((w) =>
    urls.push(w.video || ("videos/" + g + "-w" + String(w.week).padStart(2, "0") + ".mp4"))));
  return urls;
}

function updateNet() {
  const n = $("net-status");
  n.textContent = navigator.onLine ? "🟢 線上" : "🟠 離線模式（已儲存內容可正常瀏覽）";
  n.classList.toggle("offline", !navigator.onLine);
}
window.addEventListener("online", updateNet);
window.addEventListener("offline", updateNet);
updateNet();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").then(() => navigator.serviceWorker.ready).then((reg) => {
    const btn = $("btn-cache");
    btn.hidden = false;
    btn.addEventListener("click", () => {
      btn.disabled = true; btn.textContent = "儲存中…";
      (reg.active || navigator.serviceWorker.controller).postMessage({ type: "CACHE_VIDEOS", urls: allVideoUrls() });
    });
    navigator.serviceWorker.addEventListener("message", (e) => {
      if (e.data && e.data.type === "CACHE_VIDEOS_DONE") {
        btn.disabled = false;
        btn.textContent = "📥 離線儲存示範影片（已儲存 " + e.data.saved + " 支）";
      }
    });
  }).catch((err) => console.warn("SW 註冊失敗", err));
}
</script>
